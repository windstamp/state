# This is a template used in the application to generating the config file for
# training tasks
defaults:
  - data: perturbation
  - model: state
  - training: default
  - wandb: default
  - _self_

# Model size reduction for profiling (avoid OOM)
# Uncomment to override model defaults:
# model:
#   kwargs:
#     hidden_dim: 64        # Reduce from 128 to 64 (saves ~75% params)
#     num_layers: 4         # Reduce from 8 to 4 (saves ~50% params)
  

# output_dir must be an absolute path (so that launch scripts are fully descriptive)
name: debug
output_dir: ./debugging
use_wandb: true
overwrite: false
return_adatas: false
pred_adata_path: null
true_adata_path: null

# Profiling configuration
# WARNING: Profiling adds ~10-20% memory overhead. Reduce active_steps if OOM occurs.
# Set wait_steps=0, warmup_steps=0, active_steps=1 to only profile the first step
profiling:
  enabled: false
  wait_steps: 0        # Start immediately (no waiting)
  warmup_steps: 0      # No warmup (start recording immediately)
  active_steps: 1      # Only record 1 step (step 0)

# don't save hydra output
hydra:
  output_subdir: null
  run:
    dir: .
  job_logging:
    formatters:
      simple:
        format: "[%(levelname)s] %(message)s"  # Simple format for logging
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        level: INFO
        stream: ext://sys.stdout
    root:
      level: INFO
    loggers:
      __main__:
        level: DEBUG
        handlers: [console]
        propagate: false
